<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body {
            background-color: #f5f5f5;
            text-align: center;
        }

        .movie {
            display: inline-block;
            text-align: left;
            background-color: #fff;
            margin: 15px;
            padding: 20px;
            width: 260px;
            border: 1px solid #eee;
            border-radius: 10px;
            box-shadow: 0 2px 4px #ccc;
        }

        .movie:hover {
            box-shadow: 0 6px 15px #aaa;
        }

        .movie img {
            width: 100%;
            border-radius: 6px;
        }

        .movie h1 {
            font-family: "Poppins", sans-serif;
            font-size: 24px;
            color: #22343d;
            margin-bottom: 5px;
        }

        .movie p {
            font-family: "Poppins", sans-serif;
            font-size: 16px;
            color: #777;
            margin-top: 0;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

<div id="app"></div>

<script type="text/babel">
    const container = document.getElementById('app');

    const Movie = (props) => {
        const {name, year, photo} = props;

        return (
            <div className="movie">
                <img width="200" src={photo} alt={'Photo' + name}/>
                <h1>{name}</h1>
                <p>{year}</p>
            </div>
        )
    };

    const movies = (
        <div>
            <Movie name="Knives Out" year={2019} photo={"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREdXchvUBuS8MwsjVPXeuWMmStFy22bPSkVfY11Bz4RhgnzRoZBV6-YNQ&s=10"} />
            <Movie name="Inception" year={2010} photo={"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrrFOFA31IxsW8YTci1RxsdapEdUHace1q7tLb43EE0w&s=10"} />
            <Movie name="Interstellar" year={2014} photo={"https://m.media-amazon.com/images/M/MV5BYzdjMDAxZGItMjI2My00ODA1LTlkNzItOWFjMDU5ZDJlYWY3XkEyXkFqcGc@._V1_.jpg"} />
        </div>
    );

    ReactDOM.createRoot(container).render(movies);
</script>
</body>
</html>
